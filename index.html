
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Redesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg-primary: #000000;
      --bg-surface: #1c1c1e;
      --bg-card: rgba(255,255,255,0.05);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.6);
      --text-tertiary: rgba(255,255,255,0.4);
      --accent: #fa233b;
      --accent-hover: #d61a30;
      --glass: rgba(28,28,30,0.8);
      --border: rgba(255,255,255,0.1);
      --shadow: rgba(0,0,0,0.5);
      --divider: rgba(255,255,255,0.1);
    }
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-surface: #ffffff;
      --bg-card: rgba(0,0,0,0.05);
      --text-primary: #1d1d1f;
      --text-secondary: rgba(29,29,31,0.6);
      --text-tertiary: rgba(29,29,31,0.4);
      --accent: #fa233b;
      --accent-hover: #d61a30;
      --glass: rgba(255,255,255,0.85);
      --border: rgba(0,0,0,0.1);
      --shadow: rgba(0,0,0,0.15);
      --divider: rgba(0,0,0,0.1);
    }
    .bg-primary { background-color: var(--bg-primary); }
    .bg-surface { background-color: var(--bg-surface); }
    .bg-card { background-color: var(--bg-card); }
    .text-primary { color: var(--text-primary); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }
    .border-theme { border-color: var(--border); }
    .shadow-theme { box-shadow: 0 4px 20px var(--shadow); }
    .divider { background-color: var(--divider); }
    .hover-card:hover { background-color: var(--bg-card); }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    ::-webkit-scrollbar {
      display: none;
    }
    input:focus {
      outline: none;
    }
    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
  </style>
<script type="importmap">
{

    "framer-motion": "https://esm.sh/framer-motion@^12.31.0"
  }
}
</script>

</head>

</body>
</html>
